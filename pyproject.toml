[project]
name = "aegis-network"
version = "0.1.0"
description = "Lab-only signed defense evidence proof of concept"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=44,<47",
  "pydantic>=2.10,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "nats-py>=2.9,<3",
  "psycopg[binary]>=3.2,<4",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]
exclude = ["/src/aegis/launcher"]

[tool.hatch.build.targets.wheel.shared-scripts]
"src/aegis/launcher/aegis" = "aegis"

[tool.pytest.ini_options]
testpaths = ["tests"]
