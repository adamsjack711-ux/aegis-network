[project]
name = "aegis-network"
version = "0.1.0"
description = "Offline observation-only Linux package CLI and Aegis lab modules"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=44,<47",
  "pydantic>=2.10,<3",
]

[project.scripts]
aegis = "aegis.cli:main"

[project.optional-dependencies]
lab = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "nats-py>=2.9,<3",
  "psycopg[binary]>=3.2,<4",
  "uvicorn>=0.30,<1",
]
test = ["httpx>=0.27,<1", "pytest>=8,<10"]

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["aegis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
