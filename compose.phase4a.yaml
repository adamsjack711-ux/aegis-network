# A dedicated project per run, with dynamically allocated loopback ports.
name: aegis-phase4a
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${AEGIS_PHASE4A_PG_PASSWORD:?disposable password required}
      POSTGRES_DB: aegis
    ports: ["127.0.0.1::5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 1s
      timeout: 2s
      retries: 30
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:${AEGIS_PHASE4A_NATS_PORT:?disposable broker port required}:4222"
      - "127.0.0.1:${AEGIS_PHASE4A_MONITOR_PORT:?disposable monitoring port required}:8222"
    volumes: ["nats:/data"]
volumes:
  postgres:
  nats:
